{% extends "base.html" %}
{% block title %}My Account · ELM Bug Tracking System{% endblock %}
{% block content %}
  <h1>My Account</h1>

  <form class="bug-form" method="post" style="max-width: 420px;">
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    {% if success %}<p class="success">{{ success }}</p>{% endif %}

    <label>Username
      <input type="text" value="{{ current_user.username }}" disabled>
    </label>

    <label>Display Name
      <input type="text" name="display_name" value="{{ current_user.display_name }}">
    </label>

    <hr>

    <label>Current Password
      <input type="password" name="current_password" required>
    </label>

    <label>New Password <span class="optional">(leave blank to keep current password)</span>
      <input type="password" name="new_password">
    </label>

    <label>Confirm New Password
      <input type="password" name="confirm_password">
    </label>

    <div class="form-actions">
      <button type="submit">Save Changes</button>
      <a href="{{ url_for('index') }}">Cancel</a>
    </div>
  </form>
{% endblock %}
