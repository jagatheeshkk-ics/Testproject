{% extends "base.html" %}
{% block title %}{{ "Edit Bug" if bug else "New Bug" }} · ELM Bug Tracking System{% endblock %}
{% block content %}
  <h1>{{ "Edit Bug #%d" % bug.id if bug else "Report a New Bug" }}</h1>

  <form class="bug-form" method="post">
    <label>Title
      <input type="text" name="title" required value="{{ bug.title if bug else '' }}">
    </label>

    <label>Description
      <textarea name="description" rows="5">{{ bug.description if bug else '' }}</textarea>
    </label>

    <div class="row">
      <label>Severity
        <select name="severity">
          {% for severity in severities %}
            <option value="{{ severity }}" {% if bug and bug.severity == severity %}selected{% endif %}>{{ severity }}</option>
          {% endfor %}
        </select>
      </label>

      <label>Status
        <select name="status">
          {% for status in statuses %}
            <option value="{{ status }}" {% if bug and bug.status == status %}selected{% endif %}>{{ status }}</option>
          {% endfor %}
        </select>
      </label>
    </div>

    <div class="row">
      <label>Reporter
        <input type="text" value="{{ bug.reporter.display_name if bug else current_user.display_name }}" disabled>
      </label>

      <label>Assignee
        <select name="assignee_id">
          <option value="">Unassigned</option>
          {% for user in users %}
            <option value="{{ user.id }}" {% if bug and bug.assignee_id == user.id %}selected{% endif %}>{{ user.display_name }}</option>
          {% endfor %}
        </select>
      </label>
    </div>

    <label>Project
      <select name="project_id">
        <option value="">No Project</option>
        {% for project in projects %}
          <option value="{{ project.id }}" {% if bug and bug.project_id == project.id %}selected{% endif %}>{{ project.name }}</option>
        {% endfor %}
      </select>
    </label>

    <div class="form-actions">
      <button type="submit">{{ "Save Changes" if bug else "Create Bug" }}</button>
      <a href="{{ url_for('index') }}">Cancel</a>
    </div>
  </form>
{% endblock %}
