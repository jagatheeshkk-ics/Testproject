{% extends "base.html" %}
{% block title %}{{ "Edit Bug" if bug else "New Bug" }} · Bug Tracker{% endblock %}
{% block content %}
  <h1>{{ "Edit Bug #%d" % bug.id if bug else "Report a New Bug" }}</h1>

  <form class="bug-form" method="post">
    <label>Title
      <input type="text" name="title" required value="{{ bug.title if bug else '' }}">
    </label>

    <label>Description
      <textarea name="description" rows="5">{{ bug.description if bug else '' }}</textarea>
    </label>

    <div class="row">
      <label>Severity
        <select name="severity">
          {% for severity in severities %}
            <option value="{{ severity }}" {% if bug and bug.severity == severity %}selected{% endif %}>{{ severity }}</option>
          {% endfor %}
        </select>
      </label>

      <label>Status
        <select name="status">
          {% for status in statuses %}
            <option value="{{ status }}" {% if bug and bug.status == status %}selected{% endif %}>{{ status }}</option>
          {% endfor %}
        </select>
      </label>
    </div>

    <div class="row">
      <label>Reporter
        <input type="text" name="reporter" value="{{ bug.reporter if bug else '' }}">
      </label>

      <label>Assignee
        <input type="text" name="assignee" value="{{ bug.assignee if bug else '' }}">
      </label>
    </div>

    <div class="form-actions">
      <button type="submit">{{ "Save Changes" if bug else "Create Bug" }}</button>
      <a href="{{ url_for('index') }}">Cancel</a>
    </div>
  </form>
{% endblock %}
