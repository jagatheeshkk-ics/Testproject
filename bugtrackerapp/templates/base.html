<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}ELM Bug Tracking System{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <a class="brand" href="{{ url_for('index') }}">🐞 ELM Bug Tracking System</a>
      <nav>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('new_bug') }}">+ New Bug</a>
        <a href="{{ url_for('users') }}">Users</a>
        <a href="{{ url_for('statuses') }}">Statuses</a>
        <a href="{{ url_for('projects') }}">Projects</a>
        <a href="{{ url_for('notifications') }}">Notifications</a>
        <a href="{{ url_for('import_bugs') }}">Import Excel</a>
        <a href="{{ url_for('export_report') }}">Generate Report</a>
        <a href="{{ url_for('export_csv') }}">Export CSV</a>
      </nav>
      <div class="sidebar-footer">
        <a class="whoami" href="{{ url_for('account') }}">{{ current_user.display_name }}</a>
        <a href="{{ url_for('logout') }}">Log Out</a>
      </div>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
