{% extends "base.html" %}
{% block title %}Add Project · ELM Bug Tracking System{% endblock %}
{% block content %}
  <h1>Add a Project</h1>

  <form class="bug-form" method="post" style="max-width: 480px;">
    {% if error %}<p class="error">{{ error }}</p>{% endif %}

    <label>Project Name
      <input type="text" name="name" required autofocus placeholder="e.g. Website Redesign">
    </label>

    <label>Description
      <textarea name="description" rows="4"></textarea>
    </label>

    <div class="form-actions">
      <button type="submit">Add Project</button>
      <a href="{{ url_for('projects') }}">Cancel</a>
    </div>
  </form>
{% endblock %}
